<!doctype html>
<html
  data-gptskins-theme="xcode-dark"
  data-gptskins-color-scheme="dark"
  data-gptskins-font-interface="system"
  data-gptskins-font-text="system"
  data-gptskins-font-code="system"
  style="--gptskins-background:#1f1f24;--gptskins-surface:#26262b;--gptskins-surfaceStrong:#303038;--gptskins-sidebar:#18181c;--gptskins-sidebarHover:#2d2d35;--gptskins-assistantBubble:#26262b;--gptskins-userBubble:#34343d;--gptskins-composer:#303038;--gptskins-text:#f4f4f5;--gptskins-mutedText:#a1a1aa;--gptskins-border:#52525b;--gptskins-accent:#5ca7ff;--gptskins-interface-font-family:Arial,sans-serif;--gptskins-text-font-family:Georgia,serif;--gptskins-code-font-family:Consolas,monospace"

  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../content/content.css">

  </head>
  <body>
    <aside data-testid="left-sidebar"><button>Sidebar</button></aside>

          <div data-gptskins-code-block>
            <div data-gptskins-code-header>JavaScript</div>

      <form class="group/composer"><div data-testid="composer"><textarea placeholder="Message"></textarea></div></form>
      <div role="listbox"><button role="option">Suggestion</button></div>
    </main>

</html>
