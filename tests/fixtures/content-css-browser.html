<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GPT Toolkit font regression fixture (synthetic DOM)</title>
  <style>
    body { font-family: Arial; background: rgb(250, 250, 250); color: rgb(20, 20, 20); }
    .dark body { background: rgb(20, 20, 20); color: rgb(250, 250, 250); }
    button, #prompt-textarea { font-family: Arial; }
    .markdown, .markdown p, .markdown span { font-family: Arial; }
    pre, code, kbd, samp, .cm-editor, .cm-content, .cm-line, .cm-line span { font-family: Consolas; }
    .katex, .katex span, [role="math"], [role="math"] span { font-family: "Times New Roman"; }
    math { font-family: math; }
  </style>
  <link rel="stylesheet" href="../../content/content.css">
</head>
<body>
  <aside data-testid="left-sidebar"><button id="ui">Sidebar</button></aside>
  <main>
    <article data-message-author-role="assistant">
      <div class="markdown" id="markdown">
        <p id="message-text">Body <span id="explicit-span">explicit native font</span></p>
        <span class="katex"><span id="formula">formula</span></span>
        <span role="math"><span id="role-formula">formula</span></span>
        <math><mi id="mathml">x</mi></math>
        <pre><code id="code">const ready = true;</code></pre>
        <p>Inline <code id="inline-code">code</code></p>
        <div class="cm-editor"><div class="cm-scroller"><div class="cm-content"><div class="cm-line"><span id="cm-token">const value = 1;</span></div></div></div></div>
      </div>
    </article>
    <div id="prompt-textarea" class="ProseMirror" contenteditable="true">Composer</div>
  </main>
</body>
</html>
